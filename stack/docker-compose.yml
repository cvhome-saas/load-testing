      STOREFRONT_THEME_OVERRIDE: "true"
      # The build's static files go to minio-init's bucket at boot and pages point at it, as dev's point at CloudFront
      # (start.mjs; on any sync failure it serves them itself). The base URL is what a browser on this machine loads.
      STATIC_ASSETS_SYNC_ENABLED: ${LOAD_CDN:-true}
      STATIC_ASSETS_S3_BUCKET: storefront-assets
      STATIC_ASSETS_S3_PREFIX: storefront
      STATIC_ASSETS_BASE_URL: http://localhost:9000/storefront-assets/storefront
      STATIC_ASSETS_S3_ENDPOINT: http://minio:9000
      STATIC_ASSETS_S3_FORCE_PATH_STYLE: "true"
      AWS_REGION: eu-central-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "8110:8110"
    networks:
      default:
