# The load stack: the whole platform as the images `bootBuildImage` produces, one container per service, each held to
# the CPU and memory its Fargate task gets on AWS — plus the infra it needs (postgres at its RDS class, minio as the media
# store and as the CDN the storefront's static files come from, spg)
# and the monitoring that reads it (otel-collector, loki, tempo, prometheus, grafana, cadvisor), which stays uncapped so that
# observing never becomes the bottleneck. Standalone: nothing here depends on the cvhome checkout. Images are built
# beforehand (`./gradlew bootBuildImage` in cvhome, or pulled from a registry via LOAD_REGISTRY/LOAD_TAG); this file
# never builds.
#
#   make stack-up        stack/stack.sh up: resolve the sizes, docker compose -p cvhome-load up -d, wait for /actuator/health
#   make stack-sizes     the CPU and memory each service gets under LOAD_FLAVOUR / LOAD_CPU_FACTOR, without starting
#   make stack-limits    what docker applied to each running container (NanoCpus, Memory)
#   make stack-stats     memory and CPU per container, once
#   make stack-down      stop, keep the volumes;  make stack-down-hard drops them (fresh database next time)
#
# The sizes come from stack/fargate-sizes.json (a copy of cvhome-platform's flavours.yaml + services.yaml, kept in step
# by scripts/sync-fargate-sizes.mjs). stack.sh turns LOAD_FLAVOUR and LOAD_CPU_FACTOR into LOAD_CPUS_<SERVICE> and
# LOAD_MEM_<SERVICE> and exports them; the defaults below are what a plain `docker compose` without stack.sh gets: no
# CPU cap and LOAD_MEM (1g), the stack as it was before the caps. LOAD_TAG_<SERVICE> runs one service at another tag
# than LOAD_TAG (LOAD_TAG_LANDING_UI=calib-arm64), to compare two builds of it under the same caps.
#
# Ports, hostnames and store ids are the platform's local defaults, so the suite runs with TARGET=local and the
# /etc/hosts entries from `make hosts` point a browser at it. Inside the network the platform's hostnames are
# container aliases: spg proxies to catalog.gateway.com:8122 and reaches the catalog container; every JVM validates
# tokens against uaa.gateway.com:8001 and reaches uaa; the storefront calls spg-507f1f77.gateway.com:80 and reaches
# spg. `lb://` calls resolve through SimpleDiscoveryClient with the container names (SPRING_APPLICATION_JSON below).

# Which shape a container was started in, as labels: cAdvisor carries them into Prometheus, so a run's verdict knows the
# flavour and the CPU factor it ran under without asking the shell that started the stack.
x-shape: &shape
  labels:
    cvhome.load.flavour: ${LOAD_FLAVOUR:-off}
    cvhome.load.cpu-factor: ${LOAD_CPU_FACTOR:-1}

x-java-env: &java-env
  SPRING_PROFILES_ACTIVE: lcl,test-stores
  # The log levels a Fargate task runs at (cvhome fargate-config.yml), over lcl's DEBUG for com.asrevo and Spring web
  # and security: at DEBUG, checkout wrote 285 lines a request and inventory 128 while holding their connections
  # (heavy-rate60-production-mix-spike-20260914T093713Z). LOAD_LOG_LEVEL=DEBUG brings lcl's levels back.
  LOGGING_LEVEL_COM_ASREVO: ${LOAD_LOG_LEVEL:-INFO}
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB: ${LOAD_LOG_LEVEL:-WARN}
  LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY: ${LOAD_LOG_LEVEL:-WARN}
  # Every JVM exports to the collector unless told otherwise; a load stack without telemetry has nothing to read.
  OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
  INFO_STACK_NAME: load
  # The Paketo memory calculator sizes the heap from the container limit, and the JVM its GC and thread pools from the
  # CPU quota (one processor below a full core, as on a 0.25 or 0.5 vCPU task); this is the only knob worth exposing.
  JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
  SPRING_APPLICATION_JSON: >-
    {
      "com.asrevo.cvhome.app.handlers[0].schema": "http",
      "com.asrevo.cvhome.app.handlers[0].port": "8000",
      "spring.cloud.discovery.client.simple.instances.uaa[0].uri": "http://uaa:8001",
      "spring.cloud.discovery.client.simple.instances.store-core-gateway[0].uri": "http://store-core-gateway:8000",
      "spring.cloud.discovery.client.simple.instances[store-core-gateway.store-core.cvhome.lcl][0].uri": "http://store-core-gateway:8000",
      "spring.cloud.discovery.client.simple.instances.tenancy[0].uri": "http://tenancy:8020",
      "spring.cloud.discovery.client.simple.instances.billing[0].uri": "http://billing:8021",
      "spring.cloud.discovery.client.simple.instances.pod-registry[0].uri": "http://pod-registry:8022",
      "spring.cloud.discovery.client.simple.instances.console-ui[0].uri": "http://console-ui:8011",
      "spring.cloud.discovery.client.simple.instances.merchant[0].uri": "http://merchant:8120",
      "spring.cloud.discovery.client.simple.instances.content[0].uri": "http://content:8121",
      "spring.cloud.discovery.client.simple.instances.catalog[0].uri": "http://catalog:8122",
      "spring.cloud.discovery.client.simple.instances.checkout[0].uri": "http://checkout:8123",
      "spring.cloud.discovery.client.simple.instances.cua[0].uri": "http://cua:8124",
      "spring.cloud.discovery.client.simple.instances.payment[0].uri": "http://payment:8125",
      "spring.cloud.discovery.client.simple.instances.inventory[0].uri": "http://inventory:8126",
      "spring.cloud.discovery.client.simple.instances.landing-ui[0].uri": "http://landing-ui:8110",
      "spring.datasource.url": "jdbc:postgresql://postgres:5432/cvhome",
      "spring.datasource.hikari.maximum-pool-size": ${LOAD_POOL_SIZE:-10},
      "com.asrevo.cvhome.cdn.storage.s3-url": "http://minio:9000",
      "com.asrevo.cvhome.pods[0].id": "507f1f77bcf86cd799439011",
      "com.asrevo.cvhome.pods[0].name": "pod-507f1f77",
      "com.asrevo.cvhome.pods[0].domain": "spg-507f1f77.gateway.com",
      "com.asrevo.cvhome.pods[0].endpoint.endpoint": "http://spg-507f1f77.gateway.com:80",
      "com.asrevo.cvhome.pods[0].endpoint.type": "EXTERNAL",
      "com.asrevo.cvhome.pod-info.pod.id": "507f1f77bcf86cd799439011",
      "com.asrevo.cvhome.pod-info.pod.name": "pod-507f1f77",
      "com.asrevo.cvhome.pod-info.pod.domain": "spg-507f1f77.gateway.com",
      "com.asrevo.cvhome.pod-info.pod.endpoint.endpoint": "http://spg-507f1f77.gateway.com:80",
      "com.asrevo.cvhome.pod-info.pod.endpoint.type": "EXTERNAL",
      "management.otlp.tracing.endpoint": "http://otel-collector:4318/v1/traces",
      "management.otlp.metrics.export.url": "http://otel-collector:4318/v1/metrics",
      "otel.exporter.otlp.endpoint": "http://otel-collector:4317",
      "otel.exporter.otlp.protocol": "grpc"
    }

# A Spring image has no shell for a health probe, so readiness is "postgres is up, then start"; a JVM that loses
# the race to another still-starting peer retries on its own (Spring Cloud LoadBalancer, the OAuth2 client), and
# `restart: on-failure` covers a JVM that gave up. stack.sh waits on /actuator/health from the outside.
x-java: &java
  <<: *shape
  restart: on-failure:5
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ---------------------------------------------------------------- infra
  postgres:
    <<: *shape
    deploy: { resources: { limits: { cpus: "${LOAD_CPUS_POSTGRES:-0}", memory: "${LOAD_MEM_POSTGRES:-${LOAD_MEM:-1g}}" } } }
    image: ${POSTGRES_IMAGE:-postgres:15-alpine}
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: cvhome
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d cvhome" ]
      interval: 5s
      timeout: 3s
      retries: 20
    # A named volume: a plain `down` keeps every store, order and account created since the last start;
    # `make stack-down-hard` is the documented way to discard it.
    volumes:
      - postgres-data:/var/lib/postgresql/data
  minio:
    <<: *shape
    deploy: { resources: { limits: { cpus: "${LOAD_CPUS_MINIO:-0}", memory: "${LOAD_MEM_MINIO:-${LOAD_MEM:-1g}}" } } }
    # quay.io, not Docker Hub: Docker Hub no longer serves minio/minio. Same release, same image digest. The pin
    # matches cvhome's docker-compose-lcl.yml and its Testcontainers MinioTestConfiguration.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
  # CloudFront's stand-in for the storefront's static files. On AWS landing-ui uploads its build's /_next/static to S3 at
  # boot and browsers load it from CloudFront (STATIC_ASSETS_* in cvhome-platform modules/store-pod/main.tf); here it
  # uploads to this bucket, public-read like the distribution, and a browser loads it from MinIO, uncapped as CloudFront
  # is to a task. Without it every script and stylesheet of a first visit comes off landing-ui's CPU cap. One-shot, on
  # MinIO's own image and its mc; landing-ui starts after it (LOAD_CDN=false: landing-ui serves the files itself).
  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - >-
        until mc alias set load http://minio:9000 minioadmin minioadmin >/dev/null 2>&1; do sleep 1; done;
        mc mb -p load/storefront-assets && mc anonymous set download load/storefront-assets
    depends_on:
      - minio
    restart: "no"
  spg:
    <<: *shape
    deploy: { resources: { limits: { cpus: "${LOAD_CPUS_SPG:-0}", memory: "${LOAD_MEM_SPG:-${LOAD_MEM:-1g}}" } } }
    # The app's own edge image: the saas-gateway Caddy binary with the Caddyfile baked in (cvhome store-pod/spg).
    image: ${LOAD_REGISTRY:-}store-pod/spg:${LOAD_TAG_SPG:-${LOAD_TAG:-latest}}
    ports:
      - "80:80"
      - "443:443"
      - "2019:2019"
    environment:
      NAMESPACE: gateway.com
      LCL_PORT_MERCHANT: "8120"
      LCL_PORT_CONTENT: "8121"
      LCL_PORT_CATALOG: "8122"
      LCL_PORT_CHECKOUT: "8123"
      LCL_PORT_CUA: "8124"
      LCL_PORT_PAYMENT: "8125"
      LCL_PORT_INVENTORY: "8126"
      LCL_PORT_LANDING_UI: "8110"
      LCL_PORT_SPG: "80"
      LCL_PORT_SPG_TLS: "443"
      ASK_TLS_URL: http://spg-507f1f77.gateway.com:80/merchant/api/v1/router/public/ask-for-tls
      DOMAIN_LOOKUP_URL: http://spg-507f1f77.gateway.com:80/merchant/api/v1/router/public/lookup-by-domain
      CERT_BUCKET: random-bucket
      CERT_BUCKET_REGION: eu-central-1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: spg
    networks:
      default:
        aliases:
          - spg-507f1f77.gateway.com
          - spg-org3.gateway.com
          - org1-store1.spg-507f1f77.gateway.com
          - org1-store2.spg-507f1f77.gateway.com
          - org2-store1.spg-507f1f77.gateway.com
          - org2-store2.spg-507f1f77.gateway.com
          - org3-store1.spg-507f1f77.gateway.com
    depends_on:
      - merchant
      - landing-ui

  # ---------------------------------------------------------------- monitoring (uncapped: observing must never be the bottleneck)
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.150.1
    command: [ "--config=/etc/otel-collector.yml" ]
    volumes:
      - ./monitoring/otel-collector.yml:/etc/otel-collector.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
      - "13133:13133"
    depends_on:
      - loki
      - tempo
  loki:
    image: grafana/loki:3.6.10
    command: [ "-config.file=/etc/loki/loki.yml" ]
    volumes:
      - ./monitoring/loki.yml:/etc/loki/loki.yml:ro
    ports:
      - "3100:3100"
  tempo:
    image: grafana/tempo:2.10.5
    command: [ "-config.file=/etc/tempo/tempo.yml" ]
    volumes:
      - ./monitoring/tempo.yml:/etc/tempo/tempo.yml:ro
    ports:
      - "3200:3200"
  prometheus:
    image: prom/prometheus:v3.11.2
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
      - "--enable-feature=exemplar-storage"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus-rules:/etc/prometheus/rules:ro
    ports:
      - "9090:9090"
  # Every container's CPU against its cap, CPU throttling, memory against its limit, OOM kills and restarts, for
  # Prometheus (job cadvisor). Only compose containers are kept (prometheus.yml), with their service, project and the
  # shape labels stack.sh sets, so a run's verdict and the "What ran out" panels read one series per service.
  cadvisor:
    image: ghcr.io/google/cadvisor:0.55.1
    command:
      - "--docker_only=true"
      - "--housekeeping_interval=10s"
      - "--enable_metrics=cpu,memory,oom_event"
      - "--store_container_labels=false"
      - "--whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project,cvhome.load.flavour,cvhome.load.cpu-factor"
    privileged: true
    devices:
      - /dev/kmsg
    # The docker and containerd sockets by their own paths: Docker Desktop maps them to its VM's daemons, where /var/run
    # would be the Mac's; containerd's is how cAdvisor 0.53+ reads a container under Docker's containerd image store.
    # Without them cAdvisor sees bare cgroups with no names or labels, and the scrape keeps nothing.
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
  grafana:
    image: grafana/grafana:12.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/platform/cvhome-platform-overview.json
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/cvhome.yml:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

  # ---------------------------------------------------------------- store-core
  uaa:
    <<: *java
    deploy: { resources: { limits: { cpus: "${LOAD_CPUS_UAA:-0}", memory: "${LOAD_MEM_UAA:-${LOAD_MEM:-1g}}" } } }
    image: ${LOAD_REGISTRY:-}store-core/uaa:${LOAD_TAG_UAA:-${LOAD_TAG:-latest}}
    environment:
      <<: *java-env
    ports:
      - "8001:8001"
    networks:
      default:
        aliases:
          - uaa.gateway.com
  store-core-gateway:
    <<: *java
    deploy: { resources: { limits: { cpus: "${LOAD_CPUS_STORE_CORE_GATEWAY:-0}", memory: "${LOAD_MEM_STORE_CORE_GATEWAY:-${LOAD_MEM:-1g}}" } } }
    image: ${LOAD_REGISTRY:-}store-core/store-core-gateway:${LOAD_TAG_STORE_CORE_GATEWAY:-${LOAD_TAG:-latest}}
    environment:
      <<: *java-env
    ports:
      - "8000:8000"
    networks:
      default:
        aliases:
          - gateway.com
          - www.gateway.com
          - console-ui.gateway.com
  tenancy:
    <<: *java
    deploy: { resources: { limits: { cpus: "${LOAD_CPUS_TENANCY:-0}", memory: "${LOAD_MEM_TENANCY:-${LOAD_MEM:-1g}}" } } }
    image: ${LOAD_REGISTRY:-}store-core/tenancy:${LOAD_TAG_TENANCY:-${LOAD_TAG:-latest}}
    environment:
      <<: *java-env
    ports:
      - "8020:8020"
  billing:
    <<: *java
    deploy: { resources: { limits: { cpus: "${LOAD_CPUS_BILLING:-0}", memory: "${LOAD_MEM_BILLING:-${LOAD_MEM:-1g}}" } } }
    image: ${LOAD_REGISTRY:-}store-core/billing:${LOAD_TAG_BILLING:-${LOAD_TAG:-latest}}
    environment:
      <<: *java-env
    ports:
      - "8021:8021"
  pod-registry:
    <<: *java
    deploy: { resources: { limits: { cpus: "${LOAD_CPUS_POD_REGISTRY:-0}", memory: "${LOAD_MEM_POD_REGISTRY:-${LOAD_MEM:-1g}}" } } }
    image: ${LOAD_REGISTRY:-}store-core/pod-registry:${LOAD_TAG_POD_REGISTRY:-${LOAD_TAG:-latest}}
    environment:
      <<: *java-env
    ports:
      - "8022:8022"
  console-ui:
    <<: *shape
    deploy: { resources: { limits: { cpus: "${LOAD_CPUS_CONSOLE_UI:-0}", memory: "${LOAD_MEM_CONSOLE_UI:-${LOAD_MEM:-1g}}" } } }
    image: ${LOAD_REGISTRY:-}store-core/console-ui:${LOAD_TAG_CONSOLE_UI:-${LOAD_TAG:-latest}}
    environment:
      PORT: "8011"
    ports:
      - "8011:8011"

  # ---------------------------------------------------------------- store-pod
  merchant:
    <<: *java
    deploy: { resources: { limits: { cpus: "${LOAD_CPUS_MERCHANT:-0}", memory: "${LOAD_MEM_MERCHANT:-${LOAD_MEM:-1g}}" } } }
    image: ${LOAD_REGISTRY:-}store-pod/merchant:${LOAD_TAG_MERCHANT:-${LOAD_TAG:-latest}}
    environment:
      <<: *java-env
    ports:
      - "8120:8120"
    networks:
      default:
        aliases:
          - merchant.gateway.com
  content:
    <<: *java
    deploy: { resources: { limits: { cpus: "${LOAD_CPUS_CONTENT:-0}", memory: "${LOAD_MEM_CONTENT:-${LOAD_MEM:-1g}}" } } }
    image: ${LOAD_REGISTRY:-}store-pod/content:${LOAD_TAG_CONTENT:-${LOAD_TAG:-latest}}
    environment:
      <<: *java-env
    ports:
