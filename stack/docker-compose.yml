    networks:
      default:
        aliases:
          - content.gateway.com
  catalog:
    <<: *java
    deploy: { resources: { limits: { cpus: "${LOAD_CPUS_CATALOG:-0}", memory: "${LOAD_MEM_CATALOG:-${LOAD_MEM:-1g}}" } } }
    image: ${LOAD_REGISTRY:-}store-pod/catalog:${LOAD_TAG_CATALOG:-${LOAD_TAG:-latest}}
    environment:
      <<: *java-env
    ports:
      - "8122:8122"
    networks:
      default:
        aliases:
          - catalog.gateway.com
  checkout:
    <<: *java
    deploy: { resources: { limits: { cpus: "${LOAD_CPUS_CHECKOUT:-0}", memory: "${LOAD_MEM_CHECKOUT:-${LOAD_MEM:-1g}}" } } }
    image: ${LOAD_REGISTRY:-}store-pod/checkout:${LOAD_TAG_CHECKOUT:-${LOAD_TAG:-latest}}
    environment:
      <<: *java-env
