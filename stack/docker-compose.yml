  cua:
    <<: *java
    deploy: { resources: { limits: { cpus: "${LOAD_CPUS_CUA:-0}", memory: "${LOAD_MEM_CUA:-${LOAD_MEM:-1g}}" } } }
    image: ${LOAD_REGISTRY:-}store-pod/cua:${LOAD_TAG_CUA:-${LOAD_TAG:-latest}}
    environment:
      <<: *java-env
    ports:
      - "8124:8124"
    networks:
      default:
        aliases:
          - cua.gateway.com
  payment:
    <<: *java
    deploy: { resources: { limits: { cpus: "${LOAD_CPUS_PAYMENT:-0}", memory: "${LOAD_MEM_PAYMENT:-${LOAD_MEM:-1g}}" } } }
    image: ${LOAD_REGISTRY:-}store-pod/payment:${LOAD_TAG_PAYMENT:-${LOAD_TAG:-latest}}
    environment:
      <<: *java-env
    ports:
      - "8125:8125"
    networks:
      default:
        aliases:
          - payment.gateway.com
  inventory:
    <<: *java
    deploy: { resources: { limits: { cpus: "${LOAD_CPUS_INVENTORY:-0}", memory: "${LOAD_MEM_INVENTORY:-${LOAD_MEM:-1g}}" } } }
    image: ${LOAD_REGISTRY:-}store-pod/inventory:${LOAD_TAG_INVENTORY:-${LOAD_TAG:-latest}}
    environment:
      <<: *java-env
    ports:
      - "8126:8126"
    networks:
      default:
        aliases:
          - inventory.gateway.com
  landing-ui:
    <<: *shape
    deploy: { resources: { limits: { cpus: "${LOAD_CPUS_LANDING_UI:-0}", memory: "${LOAD_MEM_LANDING_UI:-${LOAD_MEM:-1g}}" } } }
    image: ${LOAD_REGISTRY:-}store-pod/landing-ui:${LOAD_TAG_LANDING_UI:-${LOAD_TAG:-latest}}
    environment:
      PORT: "8110"
      # Server-side API calls go back out through spg, by its in-network alias.
      INTERNAL_SPG: http://spg-507f1f77.gateway.com:80
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_SERVICE_NAME: landing-ui
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
